name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t adhd-yolo-backend .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install --quiet pytest mne numpy pandas scipy

      - name: Run tests
        # `python -m pytest`, not bare `pytest`: the -m form puts the current
        # directory on sys.path, which is what makes `from data_pipeline...`
        # resolve. Bare pytest does not, so it passed locally (where the shell
        # was already using -m) and failed here with ModuleNotFoundError.
        run: python -m pytest tests/ -q
        # 13 tests across two files. The TODO this replaces said not to add
        # empty stubs just for a green checkmark -- that was correct then and
        # is stale now. These tests exist because the bugs they cover were
        # real: test_epoch_rejection came from the LABEL channel rejecting
        # 100% of epochs on every subject, and test_manifest_paths from the
        # relative-path handling that made the manifest portable.
